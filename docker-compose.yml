services:
  app:
    build: .
    container_name: navi
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /app/data/navi.db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_GROUP_CHAT_ID: ${TELEGRAM_GROUP_CHAT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./fotos:/app/fotos
